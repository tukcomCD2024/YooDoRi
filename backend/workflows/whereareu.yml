name: Depoly with Docker

on:
  push:
    branches: [github-action-test]
  
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
  VERSION: ${{ github.sha }}
  NAME: whereareu

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: login to ghcr
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: make Config File
        run: |
          cd app
          echo "class Config:" >> config.py
          echo "        SQLALCHEMY_DATABASE_URI = '$DB_URL'" >> config.py
        env:
          DB_URL: ${{ secrets.DB_URL }}

      - name: Build and push
        id : docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            NAME=${{ secrets.DOCKER_IMAGE }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            DOCKER_IMAGE=${{ secrets.DOCKER_IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          
